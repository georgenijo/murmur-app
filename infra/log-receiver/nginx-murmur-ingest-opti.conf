# Deploys to /etc/nginx/sites-available/murmur-ingest on opti (symlinked into
# sites-enabled; the default site is removed). Listens only on 127.0.0.1:8601,
# reached solely via the cloudflared tunnel's georgenijo.com ingress rule.
server {
    listen 127.0.0.1:8601;
    server_name georgenijo.com;
    location = /murmur/ingest {
        proxy_pass http://127.0.0.1:8600/ingest;
        client_max_body_size 8m;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /murmur/state {
        proxy_pass http://127.0.0.1:8600/state;
    }
    location = /murmur/bundle {
        proxy_pass http://127.0.0.1:8600/bundle;
        client_max_body_size 8m;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /murmur/healthz {
        proxy_pass http://127.0.0.1:8600/healthz;
    }
    location / {
        return 404;
    }
}
