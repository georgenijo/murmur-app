# Resolved paths close import-alias, grouped-import and macro-forwarding bypasses.
# Exceptions are function-scoped and independently checked by check_restart_policy.py.
disallowed-methods = [
  { path = "std::process::exit", reason = "Use the drained shutdown coordinator (or an audited CLI-only exit)." },
  { path = "std::process::abort", reason = "Bypasses the shutdown coordinator." },
  { path = "libc::exit", reason = "Bypasses the shutdown coordinator." },
  { path = "libc::_exit", reason = "Bypasses the shutdown coordinator." },
  { path = "libc::abort", reason = "Bypasses the shutdown coordinator." },
  { path = "std::os::unix::process::CommandExt::exec", reason = "Replaces the host without draining its owners." },
]
