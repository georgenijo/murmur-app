[package]
name = "murmur-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT"

# Separate lockfile/toolchain: the shipping Tauri workspace remains unchanged.
[workspace]
resolver = "2"
members = ["."]
default-members = ["."]
exclude = ["vendor/accesskit_macos", "vendor/gpui"]

[dependencies]
chrono = "0.4"
sha2 = "0.10.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
raw-window-handle = "0.6.2"
murmur-core = { path = "../src-tauri/crates/murmur-core" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui-base = { path = "vendor/gpui-component/crates/base" }
gpui-component = { path = "vendor/gpui-component/crates/component" }

[dev-dependencies]
chrono-tz = "0.10"
accesskit_consumer = "=0.38.0"
serde_json = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", default-features = false, features = ["test-support"] }
gpui-component = { path = "vendor/gpui-component/crates/component", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Real CoreText shaping in test windows; no MacPlatform or native window.
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", features = ["font-kit"] }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "=0.26.3", optional = true }

[features]
a11y-tests = ["dep:accesskit_macos", "accesskit_macos/test-support"]
gallery = ["gpui/test-support", "gpui_platform/test-support"]

[[bin]]
name = "overlay-qa"
path = "src/bin/overlay-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "control-gallery"
path = "src/bin/control-gallery.rs"
required-features = ["gallery"]

[build-dependencies]
cc = "1"

# Same pinned revision, plus the recorded production deferred-AX fix.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/gpui" }

[patch.crates-io]
accesskit_macos = { path = "vendor/accesskit_macos" }

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
gpui-component = { path = "vendor/gpui-component/crates/component", version = "0.9.0" }
gpui-base = { path = "vendor/gpui-component/crates/base", version = "0.9.0" }
gpui-component-macros = { path = "vendor/gpui-component/crates/component-macros", version = "0.9.0" }
gpui-kit-assets = { path = "vendor/gpui-component/crates/assets", version = "0.9.0" }

# GPUI comes from the `gpui-pre-*` snapshots of Zed's crates, and any snapshot
# may change GPUI's API. These requirements are what the published gpui-kit
# crates carry to crates.io, so they pin the exact snapshot the release was
# built against: a caret requirement let the weekly release move applications
# onto a newer snapshot that gpui-component did not compile with (#3156). Bump
# every snapshot crate together with its Cargo.lock entry; `script/check-gpui-pin.ts`
# fails CI when a pin is not exact.
gpui = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", package = "gpui_platform", default-features = false, features = ["font-kit", "runtime_shaders"] }
# Fast is optional; existing crates select it through their gpui-fast feature.
# Explicit package fields make Cargo use these dependency keys as Rust crate names;
# the packages declare the same library names as the pre backend.
gpui-fast = { package = "gpui-fast", version = "0.1.13", features = ["windows-manifest-provided-by-host"] }
gpui-fast-platform = { package = "gpui-fast-platform", version = "0.1.13", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-fast-web = { package = "gpui-fast-web", version = "0.1.13" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", package = "gpui_macros" }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", package = "reqwest_client" }
sum-tree = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", package = "sum_tree" }
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "33bc764aa15ff7b200bf7c93bd96e24878d53e14", package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
] }

anyhow = "1"
instant = { version = "0.1", features = ["wasm-bindgen"] }
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "8.2.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_chars",
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "4.2.0"
schemars = "1"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
tracing = "0.1.41"
wasm-bindgen = "0.2.113"
# Use errno stub for WASM
errno = { version = "0.3.14", default-features = false }

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.58.0"

# Upstream lint configuration for the four vendored crates. murmur-ui does
# not inherit these allowances and passes its own strict Clippy invocation.
[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
# Temporarily allow this until we can migrate to the new APIs.
# https://github.com/longbridge/gpui-kit/pull/2149
useless_conversion = "allow"

[[bin]]
name = "preview-qa"
path = "src/bin/preview-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "diagnostics-qa"
path = "src/bin/diagnostics-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "history-qa"
path = "src/bin/history-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "settings-qa"
path = "src/bin/settings-qa.rs"
required-features = ["gallery"]

[[test]]
name = "native_tables"
path = "tests/native_tables.rs"
harness = false
required-features = ["a11y-tests"]

[[bin]]
name = "onboarding-qa"
path = "src/bin/onboarding-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "home-qa"
path = "src/bin/home-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "meetings-qa"
path = "src/bin/meetings-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "remaining-qa"
path = "src/bin/remaining-qa.rs"
required-features = ["gallery"]
