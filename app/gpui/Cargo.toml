[package]
name = "murmur-ui"
default-run = "ui"
autobins = false
version = "0.62.1"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT"

[dependencies]
plist = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
murmur-services = { path = "../crates/murmur-services", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"], optional = true }
chrono = "0.4"
chrono-tz = { version = "0.10", optional = true }
sha2 = "0.10.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
raw-window-handle = "0.6.2"
murmur-core = { path = "../crates/murmur-core" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui-base = { path = "vendor/gpui-component/crates/base" }
gpui-component = { path = "vendor/gpui-component/crates/component" }

[dev-dependencies]
futures = "0.3"
chrono-tz = "0.10"
accesskit_consumer = "=0.38.0"
serde_json = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", default-features = false, features = ["test-support"] }
gpui-component = { path = "vendor/gpui-component/crates/component", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Real CoreText shaping in test windows; no MacPlatform or native window.
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", features = ["font-kit"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSStatusBar", "NSStatusItem", "NSStatusBarButton"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
accesskit_macos = { version = "=0.26.3", optional = true }

[features]
native-host-qa = ["production-host", "murmur-services/native-host-qa"]
production-host = ["dep:murmur-services", "dep:tokio", "dep:plist", "dep:uuid"]
a11y-tests = ["dep:accesskit_macos", "accesskit_macos/test-support"]
gallery = ["dep:chrono-tz", "gpui/test-support", "gpui_platform/test-support"]

[[bin]]
name = "overlay-qa"
path = "src/bin/overlay-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "control-gallery"
path = "src/bin/control-gallery.rs"
required-features = ["gallery"]

[build-dependencies]
cc = "1"
serde_json = "1"

[[bin]]
name = "preview-qa"
path = "src/bin/preview-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "diagnostics-qa"
path = "src/bin/diagnostics-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "history-qa"
path = "src/bin/history-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "settings-qa"
path = "src/bin/settings-qa.rs"
required-features = ["gallery"]

[[test]]
name = "native_tables"
path = "tests/native_tables.rs"
harness = false
required-features = ["a11y-tests"]

[[bin]]
name = "onboarding-qa"
path = "src/bin/onboarding-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "home-qa"
path = "src/bin/home-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "meetings-qa"
path = "src/bin/meetings-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "remaining-qa"
path = "src/bin/remaining-qa.rs"
required-features = ["gallery"]

[[bin]]
name = "ui"
path = "src/main.rs"
required-features = ["production-host"]

[[bin]]
name = "update-qa"
path = "src/bin/update-qa.rs"
required-features = ["gallery"]
