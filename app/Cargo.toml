[workspace]
resolver = "2"
members = ["gpui", "crates/*"]
default-members = ["gpui", "crates/murmur-services", "crates/murmur-core", "crates/murmur-webkit", "crates/capture-helper-protocol"]
exclude = ["sidecars/capture", "gpui/vendor/gpui", "gpui/vendor/accesskit_macos", "vendor/fluidaudio-rs"]

# Same pinned revision, plus the recorded production deferred-AX fix.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "gpui/vendor/gpui" }

[patch."https://github.com/FluidInference/fluidaudio-rs"]
fluidaudio-rs = { path = "vendor/fluidaudio-rs" }

[patch.crates-io]
accesskit_macos = { path = "gpui/vendor/accesskit_macos" }

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
gpui-component = { path = "gpui/vendor/gpui-component/crates/component", version = "0.9.0" }
gpui-base = { path = "gpui/vendor/gpui-component/crates/base", version = "0.9.0" }
gpui-component-macros = { path = "gpui/vendor/gpui-component/crates/component-macros", version = "0.9.0" }
gpui-kit-assets = { path = "gpui/vendor/gpui-component/crates/assets", version = "0.9.0" }

# GPUI comes from the `gpui-pre-*` snapshots of Zed's crates, and any snapshot
# may change GPUI's API. These requirements are what the published gpui-kit
# crates carry to crates.io, so they pin the exact snapshot the release was
# built against: a caret requirement let the weekly release move applications
# onto a newer snapshot that gpui-component did not compile with (#3156). Bump
# every snapshot crate together with its Cargo.lock entry; `script/check-gpui-pin.ts`
# fails CI when a pin is not exact.
gpui = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", package = "gpui_platform", default-features = false, features = ["font-kit", "runtime_shaders"] }
# Fast is optional; existing crates select it through their gpui-fast feature.
# Explicit package fields make Cargo use these dependency keys as Rust crate names;
# the packages declare the same library names as the pre backend.
gpui-fast = { package = "gpui-fast", version = "0.1.13", features = ["windows-manifest-provided-by-host"] }
gpui-fast-platform = { package = "gpui-fast-platform", version = "0.1.13", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-fast-web = { package = "gpui-fast-web", version = "0.1.13" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", package = "gpui_macros" }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", package = "reqwest_client" }
sum-tree = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", package = "sum_tree" }
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "33bc764aa15ff7b200bf7c93bd96e24878d53e14", package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
] }

anyhow = "1"
instant = { version = "0.1", features = ["wasm-bindgen"] }
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "8.2.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_chars",
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "4.2.0"
schemars = "1"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
tracing = "0.1.41"
wasm-bindgen = "0.2.113"
# Use errno stub for WASM
errno = { version = "0.3.14", default-features = false }

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.58.0"

# Upstream lint configuration for the four vendored crates. murmur-ui does
# not inherit these allowances and passes its own strict Clippy invocation.
[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
# Temporarily allow this until we can migrate to the new APIs.
# https://github.com/longbridge/gpui-kit/pull/2149
useless_conversion = "allow"
