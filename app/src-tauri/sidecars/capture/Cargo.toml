[package]
name = "murmur-capture-helper"
version = "0.1.1"
edition = "2021"
publish = false

[dependencies]
cpal = "=0.18.1"
murmur-capture-helper-protocol = { path = "../../crates/capture-helper-protocol" }
# Pin the young 2.x API exactly. The signed Apple Silicon capture worker bundles
# AEC3 for the default-off Meeting Capture option; the app crate never links it.

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
block2 = "0.6"
libc = "0.2"
mach2 = "0.6"
coreaudio-rs = "0.11.3"
# Keep the existing passive HAL helpers, but use the safe owning constructor
# that separates component creation from initialization for AUHAL timing.
coreaudio-unit = { package = "coreaudio-rs", version = "=0.14.2" }
core-foundation-sys = "0.8"
core-graphics = { version = "0.25", features = ["elcapitan"] }
objc2 = "0.6"
objc2-core-audio = "0.3"
objc2-core-audio-types = { version = "0.3", features = ["CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFDictionary", "CFString"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSUUID", "NSValue"] }
webrtc-audio-processing = { version = "=2.1.0", features = ["bundled"] }

[dev-dependencies]
loom = "0.7.2"
