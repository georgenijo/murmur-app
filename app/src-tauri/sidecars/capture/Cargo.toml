[package]
name = "murmur-capture-helper"
version = "0.1.1"
edition = "2021"
publish = false

[features]
# Consent-gated local feasibility tooling for acoustic echo cancellation. This
# never builds into the normal helper or release bundle.
aec-spike = [
    "dep:hound",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:webrtc-audio-processing",
]

[dependencies]
cpal = "=0.18.1"
murmur-capture-helper-protocol = { path = "../../crates/capture-helper-protocol" }
hound = { version = "3.5", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
# Pin the young 2.x API exactly; it compiles a bundled, static AEC3 build only
# when the private aec-spike feature is requested.
webrtc-audio-processing = { version = "=2.1.0", features = ["bundled"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
coreaudio-rs = "0.11.3"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-core-audio = "0.3"
objc2-core-audio-types = { version = "0.3", features = ["CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFDictionary", "CFString"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSUUID", "NSValue"] }

[dev-dependencies]
loom = "0.7.2"
