[package]
name = "murmur-webkit"
version = "0.1.0"
edition = "2021"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
murmur-core = { path = "../murmur-core" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebsiteDataRecord", "WKUserContentController", "WKScriptMessageHandler", "WKScriptMessage", "WKURLSchemeHandler", "WKURLSchemeTask"] }
block2 = "0.6"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "synthetic_store"
harness = false
