name: Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prime_caches:
        description: Save trusted main release caches after this non-publishing rehearsal
        type: boolean
        default: false

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  context:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: bump version') }}"
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.context.outputs.source_sha }}
      cache-write: ${{ steps.context.outputs.cache_write }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate trusted main source
        id: context
        env:
          PRIME_CACHES: ${{ inputs.prime_caches || false }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ERROR: release builds may only execute from the trusted main branch"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: release source $GITHUB_SHA is not on origin/main"
            exit 1
          fi

          CACHE_WRITE=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$PRIME_CACHES" = "true" ]; then
            CACHE_WRITE=true
          fi
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "cache_write=$CACHE_WRITE" >> "$GITHUB_OUTPUT"
          {
            echo "### Trusted release build"
            echo "- source: \`$GITHUB_SHA\`"
            echo "- event: \`$GITHUB_EVENT_NAME\`"
            echo "- cache write authorized: \`$CACHE_WRITE\`"
            echo "- publication: disabled (artifacts only)"
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.source-sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: TypeScript check
        run: cd app && npx tsc --noEmit

      - name: Unit tests
        run: cd app && npm test

      - name: Workflow and artifact policy tests
        run: |
          python3 scripts/validate_workflow_policy.py
          python3 -m unittest \
            tests/test_release_artifacts.py \
            tests/test_release_version.py \
            tests/test_workflow_policy.py

  release-macos:
    needs: context
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.source-sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install capture worker build tools
        run: brew install meson ninja pkg-config

      - name: Restore release-profile Rust cache
        id: rust-cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          shared-key: macos-release-v1
          key: profile-release
          add-job-id-key: false
          save-if: ${{ needs.context.outputs.cache-write == 'true' }}

      - name: Install frontend dependencies
        run: cd app && npm ci

      - name: Locate clang runtime for ggml-metal symbol resolution
        run: |
          CLANG_RT=$(find /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang \
            -name "libclang_rt.osx.a" 2>/dev/null | sort -V | tail -1)
          if [ -z "$CLANG_RT" ]; then
            echo "ERROR: libclang_rt.osx.a not found"
            exit 1
          fi
          echo "RUSTFLAGS=-C link-arg=$CLANG_RT -C link-arg=-mmacosx-version-min=14.0 -C link-arg=-Wl,-rpath,/usr/lib/swift" >> "$GITHUB_ENV"

      - name: Build local-LLM sidecar
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_C_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
          CMAKE_CXX_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
        run: |
          # RUSTFLAGS (libclang_rt for ggml-metal symbols) is already exported by
          # the previous step; the sidecar links the same Metal ggml backend and
          # needs it too. The script places the arm64 binary at the target-triple
          # path Tauri's macOS externalBin overlay expects.
          python3 scripts/build_local_llm_sidecar.py --release

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || {
            echo "ERROR: APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD must be set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/murmur-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          CERT="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT"

      - name: Build unsigned application
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_C_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
          CMAKE_CXX_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tauri applies one entitlement file to the main binary and every
          # externalBin, so its stock signing cannot give the helper its stricter
          # sandbox-only entitlements. Build unsigned; the repository-owned
          # finalizer signs nested code inside-out afterwards. Only the .app
          # bundle is produced here; the DMG and updater archive are rebuilt from
          # the finalized, notarized app in the next step.
          cd app && npx tauri build --no-sign --bundles app --verbose

      - name: Finalize, notarize, and repackage
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIGNING_KEYCHAIN: ${{ runner.temp }}/murmur-signing.keychain-db
        run: |
          set -euo pipefail
          for VAR in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!VAR}" ] || { echo "ERROR: $VAR must be set"; exit 1; }
          done
          BUNDLE_MACOS=app/src-tauri/target/release/bundle/macos
          APP=$(find "$BUNDLE_MACOS" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "ERROR: unsigned application bundle is missing"
            exit 1
          fi
          VERSION=$(python3 -c "import json,sys;print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")

          # Sign nested code inside-out with per-binary entitlements and fail
          # closed unless strict verification passes (helper sandbox entitlement,
          # arm64, hardened runtime, fixed identifier, shared Team ID).
          python3 scripts/finalize_macos_bundle.py \
            --app "$APP" \
            --identity "$APPLE_SIGNING_IDENTITY" \
            --main-entitlements app/src-tauri/entitlements.plist \
            --llm-helper-entitlements app/src-tauri/local-llm-sidecar.entitlements.plist \
            --capture-agent-entitlements app/src-tauri/capture-agent.entitlements.plist \
            --capture-agent-info-plist app/src-tauri/capture-agent-info.plist \
            --capture-helper-info-plist app/src-tauri/sidecars/capture/Info.plist \
            --capture-worker-info-plist app/src-tauri/sidecars/capture/WorkerInfo.plist \
            --capture-agent-launchd-plist app/src-tauri/macos/com.localdictation.capture-agent.plist \
            --capture-helper-entitlements app/src-tauri/capture-helper.entitlements.plist \
            --capture-worker-entitlements app/src-tauri/capture-worker.entitlements.plist \
            --expected-team-id "$APPLE_TEAM_ID"

          # Notarize + staple the finalized app, then rebuild the DMG and the
          # updater .app.tar.gz (+ Ed25519 signature) FROM that finalized app.
          # Apple/Tauri secrets are read from the environment by the script.
          python3 scripts/notarize_and_repackage_macos.py \
            --app "$APP" \
            --app-dir app \
            --identity "$APPLE_SIGNING_IDENTITY" \
            --version "$VERSION" \
            --arch aarch64 \
            --dmg-out app/src-tauri/target/release/bundle/dmg

          # Mirror the rehearsal's Gatekeeper evidence on the release path.
          xcrun stapler validate "$APP"
          spctl --assess --type execute -vvv "$APP"

      - name: Smoke test signed capture worker protocol
        run: |
          APP=$(find app/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          CAPTURE_WORKER="$APP/Contents/MacOS/murmur-capture-worker"
          python3 scripts/smoke_test_capture_worker.py --worker "$CAPTURE_WORKER"

      - name: Smoke test signed application
        run: |
          APP=$(find app/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "ERROR: signed application bundle is missing"
            exit 1
          fi
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          BINARY="$APP/Contents/MacOS/$EXECUTABLE"
          if [ -z "$EXECUTABLE" ] || [ ! -x "$BINARY" ]; then
            echo "ERROR: signed application bundle or binary is missing"
            exit 1
          fi
          "$BINARY" &
          PID=$!
          for i in 1 2 3 4 5; do
            sleep 1
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "ERROR: signed application exited after ${i}s"
              exit 1
            fi
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

      - name: Record capture-helper signing and non-interactive probe evidence
        env:
          SOURCE_SHA: ${{ needs.context.outputs.source-sha }}
        run: |
          set -euo pipefail
          APP=$(find app/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          BINARY="$APP/Contents/MacOS/$EXECUTABLE"
          CAPTURE_AGENT="$APP/Contents/MacOS/murmur-capture-agent"
          CAPTURE_HELPER="$APP/Contents/MacOS/murmur-capture-helper"
          CAPTURE_WORKER="$APP/Contents/MacOS/murmur-capture-worker"
          EVIDENCE=capture-helper-tcc-evidence
          mkdir -p "$EVIDENCE"

          # Collect only allowlisted signature facts. Raw codesign verbose output
          # contains the runner-local Executable path and must never be uploaded.
          python3 scripts/capture_helper_evidence.py collect-signature \
            --helper "$CAPTURE_HELPER" \
            --signature-output "$EVIDENCE/signature.json" \
            --entitlements-output "$EVIDENCE/entitlements.plist"
          python3 scripts/capture_helper_evidence.py collect-signature \
            --kind capture-agent \
            --helper "$CAPTURE_AGENT" \
            --signature-output "$EVIDENCE/agent-signature.json" \
            --entitlements-output "$EVIDENCE/agent-entitlements.plist"
          python3 scripts/capture_helper_evidence.py collect-signature \
            --kind capture-worker \
            --helper "$CAPTURE_WORKER" \
            --signature-output "$EVIDENCE/worker-signature.json" \
            --entitlements-output "$EVIDENCE/worker-entitlements.plist"

          set +e
          "$BINARY" --capture-helper-probe > "$EVIDENCE/noninteractive-probe.json"
          PROBE_EXIT=$?
          set -e
          python3 scripts/capture_helper_evidence.py validate-probe \
            --probe "$EVIDENCE/noninteractive-probe.json" \
            --probe-exit "$PROBE_EXIT" \
            --source-sha "$SOURCE_SHA" \
            --signed-bundle-artifact "macos-release-$SOURCE_SHA" \
            --manifest-output "$EVIDENCE/manifest.json"

      - name: Upload capture-helper TCC rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: capture-helper-tcc-evidence-${{ needs.context.outputs.source-sha }}
          path: capture-helper-tcc-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Stage immutable macOS artifacts
        env:
          SOURCE_SHA: ${{ needs.context.outputs.source-sha }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p release-artifacts
          find app/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' \
            -exec cp {} release-artifacts/ \;
          find app/src-tauri/target/release/bundle/macos -maxdepth 1 -type f \
            \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
            -exec cp {} release-artifacts/ \;
          ARCH=$(uname -m)
          [ "$ARCH" = "arm64" ] && ARCH=aarch64

          # Record local-LLM helper provenance from the finalized bundle: hash,
          # architecture, designated requirement, Team ID, and entitlement digest.
          APP=$(find app/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          HELPER="$APP/Contents/MacOS/murmur-llm-sidecar"
          CAPTURE_AGENT="$APP/Contents/MacOS/murmur-capture-agent"
          CAPTURE_HELPER="$APP/Contents/MacOS/murmur-capture-helper"
          CAPTURE_WORKER="$APP/Contents/MacOS/murmur-capture-worker"
          if [ ! -f "$HELPER" ] || [ ! -f "$CAPTURE_AGENT" ] || \
             [ ! -f "$CAPTURE_HELPER" ] || [ ! -f "$CAPTURE_WORKER" ]; then
            echo "ERROR: finalized bundle is missing a required helper"
            exit 1
          fi
          HELPER_SHA=$(shasum -a 256 "$HELPER" | awk '{print $1}')
          HELPER_ARCH=$(lipo -archs "$HELPER" | tr -d ' \n')
          HELPER_DR=$(codesign -d -r- "$HELPER" 2>&1 | sed -n 's/^#* *designated => //p')
          if [ -z "$HELPER_DR" ]; then
            echo "ERROR: could not read the helper designated requirement"
            exit 1
          fi
          codesign -d --entitlements :- --xml "$HELPER" > "$RUNNER_TEMP/helper-entitlements.xml" 2>/dev/null
          HELPER_ENT_SHA=$(shasum -a 256 "$RUNNER_TEMP/helper-entitlements.xml" | awk '{print $1}')
          CAPTURE_HELPER_SHA=$(shasum -a 256 "$CAPTURE_HELPER" | awk '{print $1}')
          CAPTURE_HELPER_ARCH=$(lipo -archs "$CAPTURE_HELPER" | tr -d ' \n')
          CAPTURE_HELPER_DR=$(codesign -d -r- "$CAPTURE_HELPER" 2>&1 | sed -n 's/^#* *designated => //p')
          if [ -z "$CAPTURE_HELPER_DR" ]; then
            echo "ERROR: could not read the capture helper designated requirement"
            exit 1
          fi
          codesign -d --entitlements :- --xml "$CAPTURE_HELPER" > "$RUNNER_TEMP/capture-helper-entitlements.xml" 2>/dev/null
          CAPTURE_HELPER_ENT_SHA=$(shasum -a 256 "$RUNNER_TEMP/capture-helper-entitlements.xml" | awk '{print $1}')
          CAPTURE_AGENT_SHA=$(shasum -a 256 "$CAPTURE_AGENT" | awk '{print $1}')
          CAPTURE_AGENT_ARCH=$(lipo -archs "$CAPTURE_AGENT" | tr -d ' \n')
          CAPTURE_AGENT_DR=$(codesign -d -r- "$CAPTURE_AGENT" 2>&1 | sed -n 's/^#* *designated => //p')
          if [ -z "$CAPTURE_AGENT_DR" ]; then
            echo "ERROR: could not read the capture agent designated requirement"
            exit 1
          fi
          codesign -d --entitlements :- --xml "$CAPTURE_AGENT" > "$RUNNER_TEMP/capture-agent-entitlements.xml" 2>/dev/null
          CAPTURE_AGENT_ENT_SHA=$(shasum -a 256 "$RUNNER_TEMP/capture-agent-entitlements.xml" | awk '{print $1}')
          CAPTURE_WORKER_SHA=$(shasum -a 256 "$CAPTURE_WORKER" | awk '{print $1}')
          CAPTURE_WORKER_ARCH=$(lipo -archs "$CAPTURE_WORKER" | tr -d ' \n')
          CAPTURE_WORKER_DR=$(codesign -d -r- "$CAPTURE_WORKER" 2>&1 | sed -n 's/^#* *designated => //p')
          if [ -z "$CAPTURE_WORKER_DR" ]; then
            echo "ERROR: could not read the capture worker designated requirement"
            exit 1
          fi
          codesign -d --entitlements :- --xml "$CAPTURE_WORKER" > "$RUNNER_TEMP/capture-worker-entitlements.xml" 2>/dev/null
          CAPTURE_WORKER_ENT_SHA=$(shasum -a 256 "$RUNNER_TEMP/capture-worker-entitlements.xml" | awk '{print $1}')

          python3 scripts/release_artifacts.py record \
            --platform macos \
            --platform-key "darwin-${ARCH}" \
            --artifacts release-artifacts \
            --commit-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --helper-sha256 "$HELPER_SHA" \
            --helper-arch "$HELPER_ARCH" \
            --helper-designated-requirement "$HELPER_DR" \
            --helper-team-id "$APPLE_TEAM_ID" \
            --helper-entitlement-sha256 "$HELPER_ENT_SHA" \
            --capture-agent-sha256 "$CAPTURE_AGENT_SHA" \
            --capture-agent-arch "$CAPTURE_AGENT_ARCH" \
            --capture-agent-designated-requirement "$CAPTURE_AGENT_DR" \
            --capture-agent-team-id "$APPLE_TEAM_ID" \
            --capture-agent-entitlement-sha256 "$CAPTURE_AGENT_ENT_SHA" \
            --capture-worker-sha256 "$CAPTURE_WORKER_SHA" \
            --capture-worker-arch "$CAPTURE_WORKER_ARCH" \
            --capture-worker-designated-requirement "$CAPTURE_WORKER_DR" \
            --capture-worker-team-id "$APPLE_TEAM_ID" \
            --capture-worker-entitlement-sha256 "$CAPTURE_WORKER_ENT_SHA" \
            --capture-helper-sha256 "$CAPTURE_HELPER_SHA" \
            --capture-helper-arch "$CAPTURE_HELPER_ARCH" \
            --capture-helper-designated-requirement "$CAPTURE_HELPER_DR" \
            --capture-helper-team-id "$APPLE_TEAM_ID" \
            --capture-helper-entitlement-sha256 "$CAPTURE_HELPER_ENT_SHA"

      - name: Upload immutable macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ needs.context.outputs.source-sha }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Summarize macOS cache
        run: |
          {
            echo "### macOS release cache"
            echo "- restore hit: \`${{ steps.rust-cache.outputs.cache-hit || 'false' }}\`"
            echo "- write authorized: \`${{ needs.context.outputs.cache-write }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/murmur-signing.keychain-db" 2>/dev/null || true
