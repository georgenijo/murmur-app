name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filtering only, plus the push-to-main verified-tree lookup. Keep this
  # job seconds-long: every build job waits on it, so validation work belongs
  # in `policy`, which runs alongside the builds.
  changes:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump version') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    # A verified push skips the frontend jobs and every Rust test step. The
    # Rust jobs still run, build-only, when dependency manifests or this
    # workflow changed, because only main saves the Rust caches PRs restore.
    outputs:
      verified: ${{ steps.verified.outputs.verified == 'true' }}
      frontend: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.frontend == 'true' }}
      rust: ${{ steps.verified.outputs.verified == 'true' && steps.filter.outputs.rust-cache == 'true' || steps.verified.outputs.verified != 'true' && steps.filter.outputs.rust == 'true' }}
      github: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.github == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this tree already passed on its PR
        id: verified
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci_verified_tree.sh

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Docs, scripts, and Python tests are covered by `policy`, which runs
          # on every CI run, so they do not start the frontend or Rust builds.
          filters: |
            frontend:
              - 'app/src/**'
              - 'app/public/**'
              - 'app/index.html'
              - 'app/log-viewer.html'
              - 'app/overlay.html'
              - 'app/package.json'
              - 'app/package-lock.json'
              - 'app/tsconfig*.json'
              - 'app/vite.config.ts'
              - 'app/vitest.config.ts'
              - 'app/vitest.setup.ts'
              - 'app/visual-fixtures.html'
              - 'app/visual-tests/**'
              - 'app/playwright*.ts'
              # Read directly by frontend and visual tests.
              - 'app/src-tauri/tauri.conf.json'
              - 'app/src-tauri/capabilities/**'
            rust:
              - 'app/src-tauri/**'
              - 'scripts/configure_ci_rust_library.py'
              - 'app/src-tauri/Cargo.toml'
              - 'app/src-tauri/Cargo.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
            github:
              - '.github/**'
            rust-cache:
              - 'scripts/configure_ci_rust_library.py'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
              - '.github/workflows/ci.yml'

  policy:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump version') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Validate workflow policy
        run: |
          python3 -m pip install -r requirements-test.txt
          python3 scripts/validate_workflow_policy.py
          python3 scripts/validate_capture_boundary.py
          python3 scripts/validate_reference_docs.py
          python3 scripts/validate_markdown_links.py
          # This is the full set of self-contained Python unittest-style tests.
          # tests/test_murmur_canary.py is pytest-based and runs separately below.
          python3 -m unittest \
            tests/test_reference_docs.py \
            tests/test_markdown_links.py \
            tests/test_release_artifacts.py \
            tests/test_release_version.py \
            tests/test_release_start.py \
            tests/test_workflow_policy.py \
            tests/test_ci_rust_library.py \
            tests/test_capture_agent_matrix.py \
            tests/test_capture_worker_smoke.py \
            tests/test_capture_first_pcm.py \
            tests/test_native_capture_ci.py \
            tests/test_event_store.py \
            tests/test_log_receiver.py \
            tests/test_murmur_bench.py \
            tests/test_murmur_accuracy.py \
            tests/test_murmur_bench_remote.py \
            tests/test_capture_regression_watch.py \
            tests/test_dictation_lifecycle.py \
            tests/test_receiver_hang_diagnostics.py \
            tests/test_receiver_key_scrub.py \
            tests/test_reliability_slo.py
          python3 -m pytest tests/test_murmur_canary.py -q

  typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.github == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: TypeScript check
        if: matrix.shard == 1
        run: cd app && npx tsc --noEmit

      - name: Unit tests
        run: cd app && npm test -- --shard=${{ matrix.shard }}/2

  visual-linux:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.github == 'true'
    runs-on: ubuntu-latest
    # Match the Linux golden environment, including its installed fonts.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Linux visual golden tests
        run: cd app && npm run test:visual -- --shard=${{ matrix.shard }}/3

  visual-regression:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.github == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Install Playwright Chromium
        run: cd app && npx playwright install chromium

      - name: Visual golden tests
        # Use the existing runner's cores instead of adding more macOS jobs.
        run: cd app && npm run test:visual -- --shard=${{ matrix.shard }}/2 --workers=2

  # Formatting and clippy run on their own runner so lint and the test build
  # compile in parallel instead of back to back.
  rust-lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.github == 'true'
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
      CMAKE_C_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
      CMAKE_CXX_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting
        if: needs.changes.outputs.verified != 'true'
        run: cd app/src-tauri && cargo fmt --all -- --check

      - name: Install capture worker build tools
        run: brew install meson ninja pkg-config

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          # PRs restore main's cache but never save their own: each PR copy is
          # 1-2 GB and pushes the repository past its 10 GB cache quota, which
          # evicts main's and the release build's caches.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Stub externalBin helpers
        # Clippy only type-checks; tauri-build needs the externalBin paths to
        # exist. rust-macos builds and tests the real helpers.
        run: |
          cd app/src-tauri
          mkdir -p binaries
          for helper in capture-agent capture-helper capture-worker; do
            : > "binaries/murmur-$helper-aarch64-apple-darwin"
            chmod +x "binaries/murmur-$helper-aarch64-apple-darwin"
          done

      - name: Lint Rust
        # --workspace covers the capture worker and protocol crates; default-members
        # --all-targets ensures `tests/` and `examples/` are type-checked too. Clippy performs the
        # full compile check, so there is no separate `cargo check` pass.
        run: cd app/src-tauri && cargo clippy --workspace --all-targets -- -D warnings

  rust-macos:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.github == 'true'
    runs-on: macos-latest
    # One environment for every cargo invocation so build scripts that watch
    # these variables never rebuild between steps.
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
      CMAKE_C_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
      CMAKE_CXX_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
      # Panics keep file:line; full debuginfo only slows compile, link, and cache.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150

      - name: Install capture worker build tools
        run: brew install meson ninja pkg-config

      - name: Configure test-only Rust library
        # Tests need the Rust library, not the additional C/static packaging
        # outputs. Modify only this job's checkout; releases use the manifest
        # committed to the repository. Recipe metadata also refreshes the
        # dependency cache when workflow/helper changes alter the build graph.
        run: python3 scripts/configure_ci_rust_library.py

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          # PRs restore main's cache but never save their own: each PR copy is
          # 1-2 GB and pushes the repository past its 10 GB cache quota, which
          # evicts main's and the release build's caches.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Refresh sherpa-onnx native libraries
        # rust-cache prunes files under target/sherpa-onnx-prebuilt but keeps
        # the build-script fingerprint. On a partial hit Cargo can reuse that
        # fingerprint while recompiling the crate, leaving its native libs
        # missing. Remove the empty directories too: the build script treats
        # an existing lib directory as a complete download.
        run: |
          cd app/src-tauri
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean -p sherpa-onnx-sys

      - name: Build capture isolation helpers
        # PR CI compiles the Swift agent with warnings as errors and builds the
        # Rust worker protocol.
        run: |
          cd app/src-tauri
          mkdir -p binaries
          xcrun swiftc -warnings-as-errors -parse-as-library \
            -target arm64-apple-macos14.0 \
            sidecars/capture-agent/main.swift \
            -framework Foundation -framework Security \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist \
            -Xlinker capture-agent-info.plist \
            -o binaries/murmur-capture-agent-aarch64-apple-darwin
          cargo build -p murmur-capture-helper
          cp target/debug/murmur-capture-helper \
            binaries/murmur-capture-helper-aarch64-apple-darwin
          MURMUR_CAPTURE_ROLE=worker \
            CARGO_TARGET_DIR=target/capture-worker-build \
            cargo build -p murmur-capture-helper
          cp target/capture-worker-build/debug/murmur-capture-helper \
            binaries/murmur-capture-worker-aarch64-apple-darwin

      - name: Build test binaries
        # Build examples first, then every test target in one invocation.
        # Record the build metadata so nextest can select unit-test subsets
        # without asking Cargo to rebuild with a different feature graph.
        run: >-
          cd app/src-tauri &&
          cargo build --workspace
          --example murmur-eval &&
          cargo nextest list --workspace
          --lib --bin murmur-capture-helper --test topology_watch
          --message-format json --list-type binaries-only > target/ci-test-binaries.json &&
          cargo metadata --format-version 1 > target/ci-cargo-metadata.json

      - name: Run tests
        if: needs.changes.outputs.verified != 'true'
        # kind(lib) covers app and protocol crate unit tests. The capture helper
        # is bin-only, so its tests stay in the following dedicated step.
        # nextest gives every test its own process, so tests that share process
        # state stay as isolated as `cargo test -- --test-threads=1` kept them,
        # while the suite uses every core.
        run: >-
          cd app/src-tauri &&
          cargo nextest run --cargo-metadata target/ci-cargo-metadata.json
          --binaries-metadata target/ci-test-binaries.json -E 'kind(lib)'

      - name: Run capture worker unit tests
        if: needs.changes.outputs.verified != 'true'
        # Reuse both the helper's bin tests and topology_watch from the prebuild.
        # A fresh Cargo invocation for this subset recompiles native dependencies.
        run: >-
          cd app/src-tauri &&
          cargo nextest run --cargo-metadata target/ci-cargo-metadata.json
          --binaries-metadata target/ci-test-binaries.json
          -E 'package(=murmur-capture-helper)'

      - name: Run deterministic dictation evaluation
        if: needs.changes.outputs.verified != 'true'
        run: >-
          cd app/src-tauri &&
          target/debug/examples/murmur-eval deterministic
          --output target/murmur-eval/ci-report.json

  dependency-audit:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump version') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cargo-audit
        # Prebuilt binary; compiling it from source cost ~2-3 minutes per run.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust dependencies (advisory)
        continue-on-error: true
        run: |
          cd app/src-tauri
          cargo audit

      - name: Audit npm dependencies (advisory)
        continue-on-error: true
        # npm audit reads the lockfile; it does not need node_modules.
        run: |
          cd app
          npm audit --audit-level=high

  ci-pass:
    needs: [changes, policy, typecheck, visual-linux, visual-regression, rust-lint, rust-macos]
    # Keep this guard aligned with `changes`; otherwise the sentinel would turn
    # an intentionally skipped release-bump run into a failure.
    if: "${{ always() && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump version')) }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.policy.result }}"; do
            if [ "$result" != "success" ]; then
              echo "required CI job failed: $result"
              exit 1
            fi
          done

          for result in \
            "${{ needs.typecheck.result }}" \
            "${{ needs.visual-linux.result }}" \
            "${{ needs.visual-regression.result }}" \
            "${{ needs.rust-lint.result }}" \
            "${{ needs.rust-macos.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "required CI job failed or was cancelled: $result"
              exit 1
            fi
          done

          if [ "${{ needs.changes.outputs.verified }}" = "true" ]; then
            echo "CI passed: this tree already passed ci-pass on its PR head; tests skipped"
          else
            echo "CI passed"
          fi
