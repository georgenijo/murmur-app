name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump version') }}"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      github: ${{ steps.filter.outputs.github }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'app/src/**'
              - 'app/public/**'
              - 'app/index.html'
              - 'app/log-viewer.html'
              - 'app/overlay.html'
              - 'app/package.json'
              - 'app/package-lock.json'
              - 'app/tsconfig*.json'
              - 'app/vite.config.ts'
              - 'app/vitest.config.ts'
              - 'app/vitest.setup.ts'
            rust:
              - 'app/src-tauri/**'
              - 'app/src-tauri/Cargo.toml'
              - 'app/src-tauri/Cargo.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
            github:
              - '.github/**'
              - 'scripts/validate_workflow_policy.py'
              - 'scripts/release_artifacts.py'
              - 'scripts/capture_agent_matrix.py'
              - 'scripts/smoke_test_capture_worker.py'
              - 'scripts/validate_capture_boundary.py'
              - 'infra/log-receiver/**'
              - 'tests/test_release_artifacts.py'
              - 'tests/test_workflow_policy.py'
              - 'tests/test_capture_agent_matrix.py'
              - 'tests/test_capture_worker_smoke.py'
              - 'tests/test_log_receiver.py'

      - name: Validate workflow policy
        run: |
          python3 scripts/validate_workflow_policy.py
          python3 scripts/validate_capture_boundary.py
          python3 -m unittest \
            tests/test_release_artifacts.py \
            tests/test_workflow_policy.py \
            tests/test_capture_agent_matrix.py \
            tests/test_capture_worker_smoke.py \
            tests/test_log_receiver.py

  typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.github == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: TypeScript check
        run: cd app && npx tsc --noEmit

      - name: Unit tests
        run: cd app && npm test

  visual-regression:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.github == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Install Playwright Chromium
        run: cd app && npx playwright install chromium

      - name: Visual golden tests
        run: cd app && npm run test:visual

  rust-macos:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.github == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build capture isolation helpers and stub local-LLM externalBin
        # PR CI compiles the Swift agent with warnings as errors and builds the
        # Rust worker protocol. Only the heavyweight local-LLM sidecar is stubbed.
        run: |
          cd app/src-tauri
          mkdir -p binaries
          xcrun swiftc -warnings-as-errors -parse-as-library \
            -target arm64-apple-macos14.0 \
            sidecars/capture-agent/main.swift \
            -framework Foundation -framework Security \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist \
            -Xlinker capture-agent-info.plist \
            -o binaries/murmur-capture-agent-aarch64-apple-darwin
          cargo build -p murmur-capture-helper
          cp target/debug/murmur-capture-helper \
            binaries/murmur-capture-helper-aarch64-apple-darwin
          MURMUR_CAPTURE_ROLE=worker \
            CARGO_TARGET_DIR=target/capture-worker-build \
            cargo build -p murmur-capture-helper
          cp target/capture-worker-build/debug/murmur-capture-helper \
            binaries/murmur-capture-worker-aarch64-apple-darwin
          : > binaries/murmur-llm-sidecar-aarch64-apple-darwin
          chmod +x binaries/murmur-llm-sidecar-aarch64-apple-darwin

      - name: Compile check
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_C_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
          CMAKE_CXX_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
        # --all-targets so `tests/` and `examples/` are type-checked too. Without
        # it the integration suites below can rot without any signal.
        run: cd app/src-tauri && cargo check --all-targets

      - name: Run tests
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_C_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
          CMAKE_CXX_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
        run: cd app/src-tauri && cargo test --lib -- --test-threads=1

      - name: Run hardware-free integration suites
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_C_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
          CMAKE_CXX_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
        # These two drive the real supervisors against mock helpers — no model,
        # no microphone, no permissions. The remaining suites in `tests/` need
        # hardware or downloaded models and stay out of CI deliberately.
        run: >-
          cd app/src-tauri &&
          cargo build --example mock_llm_helper &&
          cargo test --test llm_sidecar_integration --test transform_flow_integration
          -- --test-threads=1

      - name: Run deterministic dictation evaluation
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_C_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
          CMAKE_CXX_FLAGS: "-march=armv8.5-a -mmacosx-version-min=14.0"
        run: >-
          cd app/src-tauri &&
          cargo run --example murmur-eval -- deterministic
          --output target/murmur-eval/ci-report.json

  linux:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.github == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # actions/checkout above must run first so the local composite action is on disk.
      - name: Setup Linux build environment
        uses: ./.github/actions/setup-linux-build
        with:
          cuda-version: '12.8.0'
          rust-cache-shared-key: linux-cuda-debug

      - name: Run tests
        run: |
          cd app/src-tauri
          LD_LIBRARY_PATH="$CUDA_DRIVER_STUB_DIR:${LD_LIBRARY_PATH:-}" \
            cargo test --lib -- --test-threads=1

  ci-pass:
    needs: [changes, typecheck, visual-regression, rust-macos, linux]
    # Keep this guard aligned with `changes`; otherwise the sentinel would turn
    # an intentionally skipped release-bump run into a failure.
    if: "${{ always() && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump version')) }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job failed: ${{ needs.changes.result }}"
            exit 1
          fi

          for result in \
            "${{ needs.typecheck.result }}" \
            "${{ needs.visual-regression.result }}" \
            "${{ needs.rust-macos.result }}" \
            "${{ needs.linux.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "required CI job failed or was cancelled: $result"
              exit 1
            fi
          done

          echo "CI passed"
