name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install -r requirements-test.txt
          python3 scripts/check_core_dependencies.py
          python3 scripts/check_native_only.py
          python3 scripts/check_targeted_events.py
          python3 -m unittest discover -s scripts -p 'test_check_targeted_events.py'
          python3 scripts/check_restart_policy.py
          python3 -m unittest discover -s scripts -p 'test_check_restart_policy.py'
          python3 scripts/validate_capture_boundary.py
          python3 scripts/validate_workflow_policy.py
          python3 scripts/validate_reference_docs.py
          python3 scripts/validate_markdown_links.py
          python3 -m unittest tests/test_native_only.py tests/test_reference_docs.py tests/test_markdown_links.py tests/test_release_artifacts.py tests/test_gpui_packaging.py tests/test_release_version.py tests/test_release_start.py tests/test_workflow_policy.py tests/test_capture_agent_matrix.py tests/test_capture_worker_smoke.py tests/test_capture_first_pcm.py tests/test_native_capture_ci.py tests/test_event_store.py tests/test_log_receiver.py tests/test_murmur_bench.py tests/test_murmur_accuracy.py tests/test_murmur_bench_remote.py tests/test_capture_helper_target.py tests/test_capture_regression_watch.py tests/test_dictation_lifecycle.py tests/test_receiver_hang_diagnostics.py tests/test_receiver_key_scrub.py tests/test_reliability_slo.py
          python3 -m pytest tests/test_murmur_canary.py -q
          cargo fmt --manifest-path scripts/updater-signer/Cargo.toml -- --check
          cargo clippy --locked --manifest-path scripts/updater-signer/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path scripts/updater-signer/Cargo.toml
  # Preserve former frontend check names as real native replacements.
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          cargo check --locked --manifest-path app/Cargo.toml -p murmur-core -p murmur-capture-helper-protocol
          cargo clippy --locked --manifest-path app/Cargo.toml -p murmur-core -p murmur-capture-helper-protocol --all-targets -- -D warnings
          cargo test --locked --manifest-path app/Cargo.toml -p murmur-core -p murmur-capture-helper-protocol -- --test-threads=1
  rust-lint:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          brew install meson ninja pkg-config
          python3 scripts/build_capture_helpers.py
          cargo fmt --manifest-path app/Cargo.toml -p murmur-services -p murmur-core -p murmur-ui -p murmur-webkit -p murmur-capture-helper-protocol -- --check
          cargo clippy --locked --manifest-path app/Cargo.toml -p murmur-services -p murmur-core -p murmur-ui -p murmur-webkit -p murmur-capture-helper-protocol --all-targets --features gallery,production-host -- -D warnings
          cargo check --locked --manifest-path app/sidecars/capture/Cargo.toml
          cargo clippy --locked --manifest-path app/sidecars/capture/Cargo.toml --all-targets -- -D warnings
  rust-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          brew install meson ninja pkg-config
          python3 scripts/build_capture_helpers.py
          cargo check --locked --manifest-path app/Cargo.toml -p murmur-services -p murmur-webkit
          # Isolate process-global state for every unit test, as before Phase 4.
          cargo nextest run --locked --manifest-path app/Cargo.toml -p murmur-services -p murmur-core -p murmur-webkit -p murmur-capture-helper-protocol --lib -E 'kind(lib)'
          # Keep the synthetic helper integration test in CI, including cold starts.
          cargo test --locked --manifest-path app/Cargo.toml -p murmur-services --test capture_helper_spike --test main_thread_queue --test native_host_contract -- --test-threads=1
          cargo test --locked --manifest-path app/Cargo.toml -p murmur-webkit --test synthetic_store
          # Tao's shutdown_appkit fixture is replaced by the GPUI host hook below.
          xcrun clang -fobjc-arc -fblocks -framework AppKit app/gpui/native/host.m app/gpui/tests/shutdown_appkit.m -o "$CARGO_TARGET_DIR/shutdown_appkit"
          "$CARGO_TARGET_DIR/shutdown_appkit"
          python3 scripts/check_native_only.py
          # Includes bin unit tests and topology_watch, each in its own process.
          cargo nextest run --locked --manifest-path app/sidecars/capture/Cargo.toml
          cargo run --locked --manifest-path app/Cargo.toml -p murmur-services --example murmur-eval -- deterministic --output app/target/murmur-eval/ci-report.json
  gpui-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          brew install meson ninja pkg-config
          python3 scripts/build_capture_helpers.py
          cargo check --locked --manifest-path app/Cargo.toml -p murmur-ui --features gallery,production-host
          python3 -m unittest scripts/test_test_gpui.py scripts/test_gpui_native.py
          python3 scripts/test_gpui.py --features production-host -- --test-threads=1
  # Former browser goldens now exercise GPUI's offscreen Metal renderer.
  visual-linux:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          case "${{ matrix.shard }}" in
            1) python3 scripts/check_gpui_goldens.py --settings-only ;;
            2) python3 scripts/check_gpui_goldens.py --onboarding-home-only ;;
            3) python3 scripts/check_gpui_goldens.py --meetings-only
               python3 scripts/check_gpui_goldens.py --remaining-only ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-visual-${{ matrix.shard }}
          path: app/target/goldens/
  visual-regression:
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 scripts/check_gpui_goldens.py --core-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-control-goldens
          path: app/target/goldens/
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - continue-on-error: true
        run: |
          cargo audit --file app/Cargo.lock
          cargo audit --file app/sidecars/capture/Cargo.lock
  ci-pass:
    needs: [changes, policy, typecheck, rust-lint, rust-macos, gpui-macos, visual-linux, visual-regression]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required native checks failed: ' + ', '.join(failed))
          PY
