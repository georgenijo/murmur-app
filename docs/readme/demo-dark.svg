<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284" role="img" aria-labelledby="t d">
  <title id="t">Dictating with Murmur</title>
  <desc id="d">The Option key is held and a small pill with a waveform appears at the bottom of the screen. When the key is released, the pill says Transcribing, then Pasted, and the spoken sentence appears in a text window.</desc>
  <style>
    :root {
      --screen: #161b22;
      --line: #30363d;
      --window: #0d1117;
      --text: #e6edf3;
      --muted: #8b949e;
      --key: #21262d;
      --key-down: #161b22;
      --key-edge: #484f58;
      --pill: #2a3038;
      --pill-edge: #484f58;
    }

    /* One loop is 9s: idle, hold the key for about 3.5s, a short wait, then the text. */
    .loop { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease-out; }

    .pill { opacity: 0; animation-name: pill; }
    .rec { opacity: 0; animation-name: rec; }
    .busy { opacity: 0; animation-name: busy; }
    .done { opacity: 0; animation-name: done; }
    .typed { opacity: 1; animation-name: typed; }
    .waiting { opacity: 0; animation-name: waiting; }
    .keytop { animation-name: key; }
    .keyface { fill: var(--key); animation-name: keyface; }

    .bar { transform-box: fill-box; transform-origin: center; animation: bar .7s ease-in-out infinite alternate; }
    .bar:nth-child(5n+2) { animation-duration: .52s; animation-delay: -.2s; }
    .bar:nth-child(5n+3) { animation-duration: .83s; animation-delay: -.5s; }
    .bar:nth-child(5n+4) { animation-duration: .61s; animation-delay: -.1s; }
    .bar:nth-child(5n) { animation-duration: .47s; animation-delay: -.35s; }
    .bar:nth-child(3n) { animation-delay: -.62s; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin .8s linear infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }

    @keyframes pill { 0%, 12% { opacity: 0; } 14%, 78% { opacity: 1; } 81%, 100% { opacity: 0; } }
    @keyframes rec { 0%, 12% { opacity: 0; } 14%, 51% { opacity: 1; } 52%, 100% { opacity: 0; } }
    @keyframes busy { 0%, 52% { opacity: 0; } 53%, 59% { opacity: 1; } 60%, 100% { opacity: 0; } }
    @keyframes done { 0%, 60% { opacity: 0; } 61%, 78% { opacity: 1; } 81%, 100% { opacity: 0; } }
    @keyframes typed { 0%, 60% { opacity: 0; } 61%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes waiting { 0%, 60% { opacity: 1; } 60.5%, 99% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes key { 0%, 11% { transform: translateY(0); } 12%, 51% { transform: translateY(3px); } 52%, 100% { transform: translateY(0); } }
    @keyframes keyface { 0%, 11% { fill: var(--key); } 12%, 51% { fill: var(--key-down); } 52%, 100% { fill: var(--key); } }
    @keyframes bar { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .loop, .bar, .spin, .blink { animation: none; }
    }

    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Display -->
  <rect x="20.5" y="10.5" width="719" height="196" rx="14" fill="var(--screen)" stroke="var(--line)"/>

  <!-- The app you were already typing in -->
  <rect x="110.5" y="32.5" width="539" height="106" rx="10" fill="var(--window)" stroke="var(--line)"/>
  <g fill="var(--line)">
    <circle cx="131" cy="51" r="4.5"/>
    <circle cx="147" cy="51" r="4.5"/>
    <circle cx="163" cy="51" r="4.5"/>
  </g>
  <g class="waiting loop">
    <rect class="blink" x="134" y="78" width="1.5" height="21" fill="var(--text)"/>
  </g>
  <g class="typed loop" fill="var(--text)" font-size="19">
    <text x="134" y="94">Can we move the launch to Thursday?</text>
    <text x="134" y="122">I still need to check the numbers with Priya.<tspan class="blink" dx="1" font-weight="300">|</tspan></text>
  </g>

  <!-- Floating pill: hidden while idle, one shape and one word per state -->
  <g class="pill loop">
    <rect x="320.5" y="157.5" width="119" height="33" rx="16.5" fill="var(--pill)" stroke="var(--pill-edge)"/>
    <g class="rec loop">
      <circle cx="337" cy="174" r="3.5" fill="#ff5f57"/>
      <g fill="var(--text)">
        <rect class="bar" x="349" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="353.5" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="358" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="362.5" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="367" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="371.5" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="376" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="380.5" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="385" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="389.5" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="394" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="398.5" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="403" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="407.5" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="412" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="416.5" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="421" y="167" width="2" height="14" rx="1"/>
        <rect class="bar" x="425.5" y="167" width="2" height="14" rx="1"/>
      </g>
    </g>
    <g class="busy loop">
      <circle class="spin" cx="337" cy="174" r="4.5" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="16 30"/>
      <text x="348" y="178.5" font-size="12" font-weight="500" fill="var(--text)">Transcribing…</text>
    </g>
    <g class="done loop">
      <path d="M353.5 174.5l3.5 3.5 7-8" fill="none" stroke="var(--text)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="371" y="178.5" font-size="12" font-weight="500" fill="var(--text)">Pasted</text>
    </g>
  </g>

  <!-- The trigger key -->
  <rect x="346" y="232" width="68" height="42" rx="8" fill="var(--key-edge)"/>
  <g class="keytop loop">
    <rect class="keyface loop" x="346.5" y="228.5" width="67" height="41" rx="7.5" stroke="var(--key-edge)"/>
    <text x="405" y="245" font-size="12" text-anchor="end" fill="var(--muted)">⌥</text>
    <text x="380" y="262" font-size="11" text-anchor="middle" fill="var(--muted)">option</text>
  </g>
</svg>
