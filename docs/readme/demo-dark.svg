<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284" role="img" aria-labelledby="t d">
  <title id="t">Dictating with Murmur</title>
  <desc id="d">The Option key is held and a waveform appears in the notch. When the key is released, the spoken sentence appears in a text window.</desc>
  <style>
    :root {
      --screen: #161b22;
      --line: #30363d;
      --window: #0d1117;
      --text: #e6edf3;
      --muted: #8b949e;
      --key: #21262d;
      --key-down: #161b22;
      --key-edge: #484f58;
    }

    /* One loop is 9s: idle, hold the key for about 3.5s, a short wait, then the text. */
    .loop { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease-out; }

    .notch { transform-origin: 380px 10px; transform: scaleX(.728); animation-name: notch; }
    .rec { opacity: 0; animation-name: rec; }
    .busy { opacity: 0; animation-name: busy; }
    .typed { opacity: 1; animation-name: typed; }
    .waiting { opacity: 0; animation-name: waiting; }
    .keytop { animation-name: key; }
    .keyface { fill: var(--key); animation-name: keyface; }

    .bar { transform-box: fill-box; transform-origin: center; animation: bar .7s ease-in-out infinite alternate; }
    .bar:nth-child(2) { animation-duration: .52s; animation-delay: -.2s; }
    .bar:nth-child(3) { animation-duration: .83s; animation-delay: -.5s; }
    .bar:nth-child(4) { animation-duration: .61s; animation-delay: -.1s; }
    .bar:nth-child(5) { animation-duration: .74s; animation-delay: -.4s; }
    .bar:nth-child(6) { animation-duration: .49s; animation-delay: -.3s; }
    .bar:nth-child(7) { animation-duration: .9s; animation-delay: -.6s; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin .8s linear infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }

    @keyframes notch { 0%, 11% { transform: scaleX(.728); } 13.5%, 59% { transform: scaleX(1); } 61.5%, 100% { transform: scaleX(.728); } }
    @keyframes rec { 0%, 13% { opacity: 0; } 14.5%, 51% { opacity: 1; } 52%, 100% { opacity: 0; } }
    @keyframes busy { 0%, 52% { opacity: 0; } 53%, 58.5% { opacity: 1; } 59.5%, 100% { opacity: 0; } }
    @keyframes typed { 0%, 59.5% { opacity: 0; } 60.5%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes waiting { 0%, 59.5% { opacity: 1; } 60%, 99% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes key { 0%, 11% { transform: translateY(0); } 12%, 51% { transform: translateY(3px); } 52%, 100% { transform: translateY(0); } }
    @keyframes keyface { 0%, 11% { fill: var(--key); } 12%, 51% { fill: var(--key-down); } 52%, 100% { fill: var(--key); } }
    @keyframes bar { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .loop, .bar, .spin, .blink { animation: none; }
    }

    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Display -->
  <rect x="20.5" y="10.5" width="719" height="196" rx="14" fill="var(--screen)" stroke="var(--line)"/>

  <!-- Notch overlay: status on the left wing, waveform on the right -->
  <path class="notch loop" d="M277 10H483V24a10 10 0 0 1-10 10H287a10 10 0 0 1-10-10Z" fill="#0b0b0c"/>
  <g class="rec loop">
    <circle cx="291" cy="22" r="3.5" fill="#ff5f57"/>
    <g fill="#ffffff">
      <rect class="bar" x="459" y="16" width="2" height="12" rx="1"/>
      <rect class="bar" x="462" y="16" width="2" height="12" rx="1"/>
      <rect class="bar" x="465" y="16" width="2" height="12" rx="1"/>
      <rect class="bar" x="468" y="16" width="2" height="12" rx="1"/>
      <rect class="bar" x="471" y="16" width="2" height="12" rx="1"/>
      <rect class="bar" x="474" y="16" width="2" height="12" rx="1"/>
      <rect class="bar" x="477" y="16" width="2" height="12" rx="1"/>
    </g>
  </g>
  <g class="busy loop">
    <circle class="spin" cx="291" cy="22" r="4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="14 30"/>
  </g>

  <!-- The app you were already typing in -->
  <rect x="110.5" y="64.5" width="539" height="110" rx="10" fill="var(--window)" stroke="var(--line)"/>
  <g fill="var(--line)">
    <circle cx="131" cy="83" r="4.5"/>
    <circle cx="147" cy="83" r="4.5"/>
    <circle cx="163" cy="83" r="4.5"/>
  </g>
  <g class="waiting loop">
    <rect class="blink" x="134" y="112" width="1.5" height="21" fill="var(--text)"/>
  </g>
  <g class="typed loop" fill="var(--text)" font-size="19">
    <text x="134" y="128">Can we move the launch to Thursday?</text>
    <text x="134" y="156">I still need to check the numbers with Priya.<tspan class="blink" dx="1" font-weight="300">|</tspan></text>
  </g>

  <!-- The trigger key -->
  <rect x="346" y="232" width="68" height="42" rx="8" fill="var(--key-edge)"/>
  <g class="keytop loop">
    <rect class="keyface loop" x="346.5" y="228.5" width="67" height="41" rx="7.5" stroke="var(--key-edge)"/>
    <text x="405" y="245" font-size="12" text-anchor="end" fill="var(--muted)">⌥</text>
    <text x="380" y="262" font-size="11" text-anchor="middle" fill="var(--muted)">option</text>
  </g>
</svg>
